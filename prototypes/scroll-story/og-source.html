<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..600&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #111216; color: #FBFBFA; font-family: "Instrument Sans", sans-serif; position: relative; }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; }
  .mark { position: absolute; left: 72px; top: 60px; display: flex; align-items: center; gap: 12px; font: 700 34px "Bricolage Grotesque"; }
  .mark i { display: inline-block; width: 30px; height: 30px; border-radius: 50%; }
  h1 { position: absolute; left: 72px; top: 150px; width: 640px; font: 800 96px/0.94 "Bricolage Grotesque"; letter-spacing: -.035em; }
  h1 span { background-image: linear-gradient(90deg, #FF6B61 0 25%, #B8AEFF 25% 50%, #F5C76B 50% 75%, #9ED9B8 75%); background-size: 100% .12em; background-repeat: no-repeat; background-position: 0 92%; }
  .q { position: absolute; left: 72px; bottom: 64px; font: 600 34px "Bricolage Grotesque"; color: #FF6B61; }
  .chat { position: absolute; right: 70px; top: 56px; width: 380px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
  .b { padding: 16px 24px; border-radius: 26px 26px 26px 8px; color: #111216; font-size: 28px; font-weight: 600; transform: rotate(var(--r)); box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  .b small { display: block; font-size: 18px; opacity: .65; margin-bottom: 2px; }
  .last { align-self: flex-end; background: #FBFBFA; border-radius: 26px 26px 8px 26px; font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 40px; }
  .threads { position: absolute; left: 0; top: 0; }
</style></head>
<body>
  <div class="glow" style="width:420px;height:420px;left:-120px;top:-160px;background:#FF6B61"></div>
  <div class="glow" style="width:420px;height:420px;right:-140px;top:-120px;background:#B8AEFF"></div>
  <div class="glow" style="width:380px;height:380px;right:120px;bottom:-220px;background:#F5C76B"></div>
  <div class="glow" style="width:360px;height:360px;left:300px;bottom:-240px;background:#9ED9B8"></div>
  <svg class="threads" width="40" height="630" viewBox="0 0 40 630">
    <path d="M14 0 C 4 120, 26 220, 12 320 S 30 520, 20 630" stroke="#FF6B61" stroke-width="3" fill="none"/>
    <path d="M20 0 C 30 140, 8 230, 22 330 S 6 520, 20 630" stroke="#B8AEFF" stroke-width="3" fill="none"/>
    <path d="M26 0 C 12 100, 34 260, 18 340 S 28 540, 20 630" stroke="#F5C76B" stroke-width="3" fill="none"/>
    <path d="M32 0 C 22 160, 16 200, 28 310 S 14 500, 20 630" stroke="#9ED9B8" stroke-width="3" fill="none"/>
  </svg>
  <p class="mark"><span><i style="background:#7567F8"></i><i style="background:#FF6B61;margin-left:-10px"></i></span>Planic</p>
  <h1>Every group chat has these <span>four.</span></h1>
  <p class="q">Which one are you?</p>
  <div class="chat">
    <p class="b" style="background:#FF6B61;--r:-2deg"><small>Aanya</small>veg options pls</p>
    <p class="b" style="background:#B8AEFF;--r:1.5deg"><small>Rohan</small>somewhere new!!</p>
    <p class="b" style="background:#F5C76B;--r:-1deg"><small>Meera</small>₹600 max, from Noida</p>
    <p class="b" style="background:#9ED9B8;--r:2deg"><small>Kabir</small>anything works</p>
    <p class="b last" style="--r:-1.5deg">so… where?</p>
  </div>
</body></html>
