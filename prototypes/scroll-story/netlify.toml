# Staging site for the scroll story (a separate Netlify site with base directory prototypes/scroll-story).
# It serves site.html, the hosted build. The live site keeps using the netlify.toml at the repo root.
[build]
  publish = "."

# force: index.html (the local development page) also exists here, and Netlify would serve it instead
# of the rewrite. It loads modules from outside this folder, so on Netlify it ran with no motion.
[[redirects]]
  from = "/"
  to = "/site.html"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/site.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/film/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
